apiVersion: v1
kind: Service
metadata:
  name: ServiceTrivia
  labels:
    name: ServiceTrivia
spec:
  selector:
    app: ServiceTrivia
    version: DEPLOY_VERSION
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
  type: NodePort